name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runtime harness on both Linux and macOS — the matrix continuously verifies portability
  # (e.g. the sed / grep idioms that differ on BSD/macOS).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint — every bash script parses
        run: |
          for f in bin/* setup/*.sh examples/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            case "$f" in *.py) continue ;; esac
            bash -n "$f"
          done
      - name: Gate smoke tests
        run: bash tests/test_gates.sh
      - name: Adversarial integrity and bounded-loop contracts
        run: python tests/test_hardening.py
      - name: Worked example
        run: bash examples/demo.sh
      - name: Pre-publish gate (leaks / over-claim / worked example)
        run: bash setup/pre-publish-check.sh

  # Build + import the MCP server in a clean env — catches "works in the repo, broken on install".
  #
  # 🔴 Windows is in this matrix on purpose. The 2026-08-24 field report that produced the
  #    `_run` fixes came from Windows, and the rest of CI is ubuntu+macos only — so the
  #    ORIGIN ENVIRONMENT OF THE DEFECT WAS NOT COVERED BY THE GREEN. Install+import alone
  #    also never exercised the subprocess contract those fixes changed, so the contract
  #    tests run here too. The gate suite is bash and stays on the unix matrix above; this
  #    job is the Python layer, which is where both reported P0s actually lived.
  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yeoul-mcp from source
        run: pip install ./mcp
      - name: Import the server + confirm the tool surface
        # `shell: bash` is required now that this job also runs on Windows: the default shell
        # there is PowerShell, which has no heredoc — `python - <<'PY'` is a parse error.
        shell: bash
        run: |
          python - <<'PY'
          from yeoul_mcp import server
          tools = [n for n in dir(server) if n in (
              'yeoul_new','arc_open','arc_ticket','loop_guard_init','loop_guard_tick',
              'arc_close','build_handoff','ralph_gate_check','arc_prereg','verify_gate',
              'status','arc_list','workspace_prepare','workspace_execute','workspace_tasks')]
          assert len(tools) == 15, tools
          # ASCII only: the em-dash renders as "?" on the Windows console, which reads like
          # a mojibake defect in the log when nothing is actually wrong.
          print("yeoul-mcp OK - 15 tools")
          PY
      - name: _run subprocess contract (stdin never inherited, UTF-8 pinned)
        run: python mcp/tests/test_run_contract.py
      - name: serverInfo contract (announces its own version, not the SDK's)
        # The import check above proves the module loads; it never reads the handshake. This
        # step launches the server and reads what it actually says on the wire.
        run: python mcp/tests/test_serverinfo_version.py
      - name: Managed runtime permissions, receipts, process locks and real stdio
        run: python mcp/tests/test_runtime_contract.py
      - name: Independent product CLI, approvals, recovery and stdio reconnection
        # Standalone suite runs FIRST: Mirror must not be required to use Yeoul.
        run: python mcp/tests/test_product.py
      - name: Install optional Mirror contract for integration tests
        run: pip install "git+https://github.com/mirror-stack/mirror-stack-mcp@v0.2.14"
      - name: CLI/MCP parity and real Mirror result contract
        run: python mcp/tests/test_surface_contract.py
      - name: Installed harness works away from the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from yeoul_mcp import server
          assert '_harness' in str(server.BIN), server.BIN
          with tempfile.TemporaryDirectory() as tmp:
              result = server.yeoul_new('installed-smoke', workspace=tmp, no_arc=True)
              assert result['exit_code'] == 0, result
              spec = Path(tmp)/'projects'/'installed-smoke'/'design'/'spec.md'
              assert '**Goal**' in spec.read_text(encoding='utf-8')
          PY
      - name: Installed product CLI and MCP outside the checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          PRODUCT_TEST_INSTALLED=1 python "$GITHUB_WORKSPACE/mcp/tests/test_product.py"
      - name: Source archive builds a self-contained wheel too
        shell: bash
        run: |
          python -m pip install build
          python -m build ./mcp --sdist --outdir "$RUNNER_TEMP/yeoul-sdist"
          python -m pip wheel "$RUNNER_TEMP"/yeoul-sdist/*.tar.gz --no-deps --wheel-dir "$RUNNER_TEMP/yeoul-wheel"
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          wheel = next((Path(os.environ['RUNNER_TEMP'])/'yeoul-wheel').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              for path in ('bin/arc-close', 'bin/prereg_check.py', 'bin/ralph_core.py', 'templates/spec.md', 'LICENSE'):
                  assert 'yeoul_mcp/_harness/'+path in archive.namelist(), path
          PY
